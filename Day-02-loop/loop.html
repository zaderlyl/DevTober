<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 02 - Loop</title>
<style>
  :root { --bg: #1f9d55; --ink: #fff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, Menlo, monospace;
    padding: 28px 16px 48px;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: clamp(28px, 6vw, 44px); letter-spacing: -.01em; }
  .sub { margin-top: 8px; font-size: 14px; opacity: .8; line-height: 1.5; max-width: 60ch; }
  a { color: inherit; }

  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin: 28px 0 8px; }
  .controls label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
  .controls input {
    font: inherit; font-size: 14px; color: var(--ink); text-transform: none; letter-spacing: 0;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 8px 10px;
  }
  .controls input::placeholder { color: rgba(255,255,255,.55); }
  #ttl { width: 72px; }
  #iut { width: min(360px, 78vw); }
  button {
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    background: var(--ink); color: var(--bg); border: 0; border-radius: 8px; padding: 9px 18px;
  }
  button:disabled { opacity: .5; cursor: default; }
  .note { font-size: 12px; opacity: .75; min-height: 18px; margin-bottom: 8px; }

  /* scène : GitHub — navigateur — IUT */
  .stage { position: relative; height: 220px; margin: 12px 0 8px; }
  .line { position: absolute; left: 12%; right: 12%; top: 50%; height: 2px; background: rgba(255,255,255,.35); transform: translateY(-50%); }
  .node {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: clamp(86px, 22vw, 130px); padding: 14px 8px; text-align: center;
    border: 2px solid var(--ink); border-radius: 16px; background: var(--bg);
  }
  .node.sim { border-style: dashed; }
  .node .name { font-weight: 700; font-size: clamp(12px, 3vw, 15px); }
  .node .lat { margin-top: 6px; font-size: 11px; opacity: .85; min-height: 14px; }
  #n-github { left: 12%; }
  #n-browser { left: 50%; }
  #n-iut { left: 88%; }
  .ttl { font-size: clamp(26px, 6vw, 38px); font-weight: 700; line-height: 1; margin-top: 4px; }
  .ttl small { display: block; font-size: 10px; font-weight: 400; letter-spacing: .12em; opacity: .7; margin-bottom: 2px; }

  .packet, .spark {
    position: absolute; left: 0; top: 0; border-radius: 50%; background: var(--ink);
    pointer-events: none;
  }
  .packet { width: 22px; height: 22px; margin: -11px 0 0 -11px; box-shadow: 0 0 18px rgba(255,255,255,.8); opacity: 0; }
  .spark { width: 8px; height: 8px; margin: -4px 0 0 -4px; }

  .log { list-style: none; margin-top: 16px; font-size: 13px; line-height: 1.9; }
  .log li { display: flex; gap: 14px; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.14); }
  .log .hop { opacity: .6; width: 28px; }
  .log .ttlc { width: 70px; }
  .log .who { width: 64px; font-weight: 700; }
  .log .ms { width: 70px; text-align: right; }
  .log .tag { opacity: .8; }
  .log .done { border-bottom: 0; opacity: .85; }
</style>
</head>
<body>
<main>
  <h1>Day 02 / Loop</h1>
  <p class="sub">Un paquet fait des allers-retours entre un serveur GitHub et un serveur IUT, avec le navigateur comme relais. Chaque aller-retour lui coûte une vie (TTL), jusqu'à ce qu'il se dissipe.</p>

  <div class="controls">
    <label>TTL <input id="ttl" type="number" min="1" max="16" value="8"></label>
    <label>URL du ping.php (IUT) <input id="iut" type="url" placeholder="https://…/ping.php"></label>
    <button id="send">Envoyer</button>
  </div>
  <p class="note" id="note"></p>

  <div class="stage" id="stage">
    <div class="line"></div>
    <div class="node" id="n-github"><div class="name">GITHUB</div><div class="lat" id="lat-github">&nbsp;</div></div>
    <div class="node" id="n-browser"><div class="name">NAVIGATEUR</div><div class="ttl"><small>TTL</small><span id="ttl-now">–</span></div></div>
    <div class="node" id="n-iut"><div class="name">IUT</div><div class="lat" id="lat-iut">&nbsp;</div></div>
    <div class="packet" id="packet"></div>
  </div>

  <ul class="log" id="log"></ul>
</main>

<script>
const GITHUB_URL = 'https://zaderlyl.github.io/DevTober/Day-02-loop/pong.json';
const IUT_URL = 'https://web-mmi2.iutbeziers.fr/~lilian.cornet/ping.php';   // valeur par défaut du champ
const LEG_MS = 380;         // durée d'un trajet affiché (le vrai réseau est plus rapide, on le ralentit pour le voir)
const TIMEOUT_MS = 4000;     // au-delà, le serveur est considéré injoignable

const $ = id => document.getElementById(id);
const stage = $('stage'), packet = $('packet'), log = $('log'), note = $('note');
const ttlInput = $('ttl'), iutInput = $('iut'), sendBtn = $('send'), ttlNow = $('ttl-now');
const nodes = { github: $('n-github'), browser: $('n-browser'), iut: $('n-iut') };

// l'URL IUT est retenue d'une visite à l'autre
iutInput.value = IUT_URL;
try { iutInput.value = localStorage.getItem('devtober-iut-url') || IUT_URL; } catch (e) {}
iutInput.addEventListener('change', () => {
  try { localStorage.setItem('devtober-iut-url', iutInput.value.trim()); } catch (e) {}
});

// position du centre d'un nœud dans la scène
function center(name) {
  const s = stage.getBoundingClientRect(), r = nodes[name].getBoundingClientRect();
  return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 };
}

const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// fait voyager le paquet d'un nœud à l'autre ; sa visibilité suit le TTL restant
function travel(from, to, ttlFrom, ttlTo, ttlMax) {
  const a = center(from), b = center(to);
  const o = ttl => 0.2 + 0.8 * (ttl / ttlMax);
  return new Promise(resolve => {
    const start = performance.now();
    (function tick(now) {
      const p = Math.min(1, (now - start) / LEG_MS), e = ease(p);
      packet.style.transform = `translate(${a.x + (b.x - a.x) * e}px, ${a.y + (b.y - a.y) * e}px)`;
      packet.style.opacity = o(ttlFrom + (ttlTo - ttlFrom) * p);
      p < 1 ? requestAnimationFrame(tick) : resolve();
    })(start);
  });
}

// le paquet se dissipe : une gerbe de particules qui s'éteignent
function dissipate(at) {
  const c = center(at);
  packet.style.opacity = 0;
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.transform = `translate(${c.x}px, ${c.y}px)`;
    stage.appendChild(s);
    const ang = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 90;
    const anim = s.animate([
      { transform: `translate(${c.x}px, ${c.y}px) scale(1)`, opacity: .9 },
      { transform: `translate(${c.x + Math.cos(ang) * dist}px, ${c.y + Math.sin(ang) * dist}px) scale(0)`, opacity: 0 },
    ], { duration: 700 + Math.random() * 400, easing: 'ease-out' });
    anim.onfinish = () => s.remove();
  }
}

// un vrai aller-retour réseau ; si le serveur est injoignable, le saut est simulé (et indiqué comme tel)
async function ping(side, ttl) {
  const t0 = performance.now();
  const base = side === 'iut' ? iutInput.value.trim() : GITHUB_URL;
  const simulated = why => ({ ttl: ttl - 1, ms: 25 + Math.random() * 60, real: false, why });
  if (!base) return simulated('pas d\'URL');

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const url = base + (base.includes('?') ? '&' : '?') + (side === 'iut' ? `ttl=${ttl}&` : '') + `t=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let next = ttl - 1;
    if (side === 'iut') {
      const data = await res.json();
      if (Number.isFinite(data.ttl)) next = data.ttl;   // le serveur décrémente
    } else {
      await res.text();                                 // fichier statique : le navigateur décrémente
    }
    // quoi que réponde le serveur, le TTL doit baisser : la boucle se termine toujours
    return { ttl: Math.min(next, ttl - 1), ms: performance.now() - t0, real: true };
  } catch (e) {
    return simulated(e.name === 'AbortError' ? 'délai dépassé' : 'injoignable');
  } finally {
    clearTimeout(timer);
  }
}

function addLog(html, cls = '') {
  const li = document.createElement('li');
  li.className = cls;
  li.innerHTML = html;
  log.appendChild(li);
}

let running = false;
async function run() {
  if (running) return;
  running = true;
  sendBtn.disabled = true;

  const max = Math.max(1, Math.min(16, parseInt(ttlInput.value, 10) || 8));
  ttlInput.value = max;
  let ttl = max, hop = 0, real = 0;
  log.innerHTML = '';
  note.textContent = iutInput.value.trim() ? '' : 'Pas d\'URL IUT : ses sauts seront simulés. Renseigne l\'URL du ping.php pour des mesures réelles.';
  ttlNow.textContent = ttl;
  const c0 = center('browser');
  packet.style.transform = `translate(${c0.x}px, ${c0.y}px)`;
  packet.style.opacity = 1;

  while (ttl > 0) {
    const side = hop % 2 === 0 ? 'iut' : 'github';
    // le paquet part vers le serveur pendant que la vraie requête est en vol
    const [res] = await Promise.all([ping(side, ttl), travel('browser', side, ttl, ttl, max)]);
    nodes[side].classList.toggle('sim', !res.real);
    $('lat-' + side).textContent = `${Math.round(res.ms)} ms · ${res.real ? 'réel' : 'simulé'}`;
    await travel(side, 'browser', ttl, res.ttl, max);   // retour : le TTL est perdu en chemin

    hop++;
    if (res.real) real++;
    addLog(
      `<span class="hop">${String(hop).padStart(2, '0')}</span>` +
      `<span class="ttlc">TTL ${ttl} → ${res.ttl}</span>` +
      `<span class="who">${side.toUpperCase()}</span>` +
      `<span class="ms">${Math.round(res.ms)} ms</span>` +
      `<span class="tag">${res.real ? 'réel' : 'simulé (' + res.why + ')'}</span>`
    );
    ttl = res.ttl;
    ttlNow.textContent = ttl;
  }

  dissipate('browser');
  addLog(`Paquet dissipé après ${hop} sauts (${real} réels, ${hop - real} simulés).`, 'done');
  await sleep(900);
  running = false;
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', run);
</script>
</body>
</html>
