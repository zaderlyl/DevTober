<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 01 - Pulse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #1f9d55; overflow: hidden; font-family: ui-monospace, Menlo, monospace; }
  .hint { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); color: #fff; opacity: .4; font-size: 13px; letter-spacing: .15em; text-transform: uppercase; }
  .letter {
    position: fixed; left: 50%; top: 50%;
    font-size: 120px; line-height: 1; font-weight: 700; color: #fff;
    will-change: transform;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="hint">tape une touche</div>

<script>
const GRAVITY = 2400;      // px/s²
const PULSE_TIME = 0.35;   // durée du battement avant la chute

const letters = [];

document.addEventListener('keydown', e => {
  if (e.key.length !== 1 || e.key === ' ') return;
  const el = document.createElement('div');
  el.className = 'letter';
  el.textContent = e.key.toUpperCase();
  document.body.appendChild(el);
  letters.push({ el, t: 0, y: 0, vy: 0, settled: false });
});

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  for (const l of letters) {
    l.t += dt;

    let scale = 1;
    if (l.t < PULSE_TIME) {
      // pulse : monte à 1.5 puis revient à 1
      const p = l.t / PULSE_TIME;
      scale = 1 + 0.5 * Math.sin(p * Math.PI);
    } else {
      l.vy += GRAVITY * dt;
      l.y += l.vy * dt;
    }

    l.el.style.transform = `translate(-50%, calc(-50% + ${l.y}px)) scale(${scale})`;

    // sol : bord bas de la fenêtre, remonté de la hauteur des lettres déjà posées
    if (!l.settled) {
      const stack = letters.reduce((h, o) => o.settled ? h + o.el.offsetHeight : h, 0);
      const floorY = window.innerHeight / 2 - l.el.offsetHeight / 2 - stack;
      if (l.y >= floorY) {
        l.y = floorY;
        l.vy = 0;
        l.settled = true;
      }
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
